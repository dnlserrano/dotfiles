# ~/.tmux.conf -- minimal, plugin-free, Ubuntu-flavoured (aubergine + orange).

# Panes and windows
unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind C-l send-keys 'C-l'

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g status-interval 15
set -g xterm-keys on

# Vi-style copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Smart pane switching, aware of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Status bar: deep purple background, Ubuntu orange accents. No TPM/plugins.
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour53,fg=colour255'
set -g status-left-length 20
set -g status-right-length 90
set -g status-left '#[fg=colour233,bg=colour166,bold] #S #[fg=colour255,bg=colour53] '
set -g status-right '#[fg=colour166]#(cd #{pane_current_path} 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed "s/^/git:/")#[fg=colour255] load #(cut -c1-15 /proc/loadavg) #[fg=colour233,bg=colour166,bold] %H:%M '

set -g window-status-format '#[fg=colour245,bg=colour53] #I:#W '
set -g window-status-current-format '#[fg=colour233,bg=colour166,bold] #I:#W '
set -g window-status-separator ''
set -g window-status-activity-style 'fg=colour166,bg=colour53'

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour166'
set -g message-style 'fg=colour233,bg=colour166'
set -g mode-style 'fg=colour233,bg=colour166'
